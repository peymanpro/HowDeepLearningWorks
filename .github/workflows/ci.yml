name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore HowDeepLearningWorks.sln

      - name: Build solution
        run: dotnet build HowDeepLearningWorks.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test tests/HowDeepLearningWorks.Tests/HowDeepLearningWorks.Tests.csproj --configuration Release --no-build --no-restore

      - name: Run console demonstration
        run: dotnet run --project examples/HowDeepLearningWorks.Console/HowDeepLearningWorks.Console.csproj --configuration Release --no-build

  publish-v1-release:
    name: Publish v1.0.0 GitHub Release
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.head_commit.message == 'release: publish v1.0.0' }}"
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 \
            --target "${GITHUB_SHA}" \
            --title "HowDeepLearningWorks v1.0.0" \
            --notes-file docs/RELEASE-NOTES-v1.0.0.md
