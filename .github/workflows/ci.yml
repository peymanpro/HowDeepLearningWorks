name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore SharpNeuralNetwork.sln

      - name: Build solution
        run: dotnet build SharpNeuralNetwork.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test tests/SharpNeuralNetwork.Tests/SharpNeuralNetwork.Tests.csproj --configuration Release --no-build --no-restore

      - name: Run console demonstration
        run: dotnet run --project examples/SharpNeuralNetwork.Console/SharpNeuralNetwork.Console.csproj --configuration Release --no-build
